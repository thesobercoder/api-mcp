name: image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 21 * * 0' # Weekly rebuild picks up the newest Bun release.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/api-mcp
  CAN_DEPLOY: ${{ secrets.RAILWAY_TOKEN != '' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=api-mcp
            org.opencontainers.image.description=OpenAPI-to-MCP gateway for Bifrost, built on Bun

      # Tests and type checks run inside the build, on the same Bun that ships.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Point Railway at the exact image just built, then deploy it.
      - name: Deploy to Railway
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CAN_DEPLOY == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          IMAGE_REF: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          gql() {
            curl -fsS https://backboard.railway.com/graphql/v2 \
              -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg q "$1" --argjson v "$2" '{query:$q,variables:$v}')" \
              | tee /dev/stderr | jq -e '.errors == null' >/dev/null
          }
          vars=$(jq -nc --arg s "$SERVICE_ID" --arg e "$ENVIRONMENT_ID" --arg i "$IMAGE_REF" '{s:$s,e:$e,i:$i}')
          gql 'mutation($s:String!,$e:String!,$i:String!){serviceInstanceUpdate(serviceId:$s,environmentId:$e,input:{source:{image:$i}})}' "$vars"
          gql 'mutation($s:String!,$e:String!){serviceInstanceDeployV2(serviceId:$s,environmentId:$e)}' "$vars"
